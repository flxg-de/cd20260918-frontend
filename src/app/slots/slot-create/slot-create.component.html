<div class="mx-auto max-w-2xl px-6 py-10">
  <p class="oc-eyebrow mb-2">#SLOTS</p>
  <h2 class="oc-display mb-8 text-2xl">Neuen Slot anlegen</h2>

  <form (submit)="submit($event)" class="flex flex-col gap-6">
    <label class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-oc-ink">Raum</span>
      <input
        type="text"
        [formField]="slotForm.room"
        class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
      />
      @if (slotForm.room().touched() && !slotForm.room().valid()) {
        @for (err of slotForm.room().errors(); track err.kind) {
          <span class="text-sm text-oc-red">{{ err.message }}</span>
        }
      }
    </label>

    <div class="grid grid-cols-2 gap-4">
      <label class="flex flex-col gap-1">
        <span class="text-sm font-semibold text-oc-ink">Start</span>
        <input
          type="datetime-local"
          [formField]="slotForm.startTime"
          class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
        />
        @if (slotForm.startTime().touched() && !slotForm.startTime().valid()) {
          @for (err of slotForm.startTime().errors(); track err.kind) {
            <span class="text-sm text-oc-red">{{ err.message }}</span>
          }
        }
      </label>

      <label class="flex flex-col gap-1">
        <span class="text-sm font-semibold text-oc-ink">Ende</span>
        <input
          type="datetime-local"
          [formField]="slotForm.endTime"
          class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
        />
        @if (slotForm.endTime().touched() && !slotForm.endTime().valid()) {
          @for (err of slotForm.endTime().errors(); track err.kind) {
            <span class="text-sm text-oc-red">{{ err.message }}</span>
          }
        }
      </label>
    </div>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-oc-ink">Kapazität (Minuten)</span>
      <input
        type="number"
        [formField]="slotForm.capacityMinutes"
        class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
      />
      @if (slotForm.capacityMinutes().touched() && !slotForm.capacityMinutes().valid()) {
        @for (err of slotForm.capacityMinutes().errors(); track err.kind) {
          <span class="text-sm text-oc-red">{{ err.message }}</span>
        }
      }
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-oc-ink">Format</span>
      <select
        [formField]="slotForm.format"
        class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
      >
        <option value="">Bitte wählen</option>
        @for (option of formatOptions; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
      @if (slotForm.format().touched() && !slotForm.format().valid()) {
        @for (err of slotForm.format().errors(); track err.kind) {
          <span class="text-sm text-oc-red">{{ err.message }}</span>
        }
      }
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-oc-ink">Standort (optional)</span>
      <select
        [formField]="slotForm.location"
        class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
      >
        <option value="">Kein Standort</option>
        @for (option of locationOptions; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-oc-ink">Swimlane (optional)</span>
      <input
        type="text"
        [formField]="slotForm.swimlane"
        class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
      />
    </label>

    <label class="flex flex-col gap-1">
      <span class="text-sm font-semibold text-oc-ink">Label (optional, z. B. bei fixen Blöcken)</span>
      <input
        type="text"
        [formField]="slotForm.label"
        class="rounded-md border border-oc-gray-300 px-3 py-2 text-sm text-oc-ink"
      />
    </label>

    <label class="flex items-center gap-2">
      <input type="checkbox" [formField]="slotForm.locked" />
      <span class="text-sm font-semibold text-oc-ink"
        >Fixer Tagesablauf-Block (nicht für Talk-Zuordnung freigegeben)</span
      >
    </label>

    @if (submitError(); as message) {
      <p class="rounded-md border border-oc-red bg-oc-red/5 px-4 py-3 text-sm text-oc-red">
        {{ message }}
      </p>
    }

    <button
      type="submit"
      [disabled]="isSubmitting()"
      class="self-start rounded-md bg-oc-blue px-4 py-2 text-sm font-semibold text-oc-white transition-colors hover:bg-oc-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isSubmitting() ? 'Wird angelegt…' : 'Slot anlegen' }}
    </button>
  </form>
</div>
